<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="snapGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Base frame rounded rect -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#snapGrad)" />
  <!-- Inner viewport cutout -->
  <rect x="5.5" y="5.5" width="21" height="21" rx="5" fill="#0F172A" />
  <!-- Browser top bar dots -->
  <circle cx="9" cy="9.5" r="1.2" fill="#EF4444" />
  <circle cx="12.5" cy="9.5" r="1.2" fill="#F59E0B" />
  <circle cx="16" cy="9.5" r="1.2" fill="#10B981" />
  <!-- Shutter / Lens icon inside screen -->
  <circle cx="16" cy="17.5" r="4.5" stroke="url(#snapGrad)" stroke-width="1.8" fill="none" />
  <circle cx="16" cy="17.5" r="2" fill="#38BDF8" />
  <!-- Viewfinder corners -->
  <path d="M8 14V13H9" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
  <path d="M24 14V13H23" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
  <path d="M8 21V22H9" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
  <path d="M24 21V22H23" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
</svg>
